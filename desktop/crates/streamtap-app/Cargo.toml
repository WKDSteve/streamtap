[package]
name = "streamtap-app"
version = "0.1.0"
description = "Desktop app: starts and stops streamtap-sink, lists captures and muxes them"
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
# The shell only: no plugins (no fs, shell, opener), the webview gets the app's own commands and nothing else.
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true
