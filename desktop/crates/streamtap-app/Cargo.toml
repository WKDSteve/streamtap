[package]
name = "streamtap-app"
version = "0.1.0"
description = "Desktop app: starts and stops streamtap-sink, lists captures and muxes them"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

[dependencies]
# The shell only: no plugins (no fs, shell, opener), the webview gets the app's own commands and nothing else.
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Message schema, framing limits and names shared with the native messaging host.
streamtap-host = { path = "../streamtap-host" }

# Kill-on-close job objects tie the sink and mux children to the app (a hard kill of the app kills them too).
# Safe wrapper; the unsafe Win32 calls live in the crate, the workspace forbids them in ours.
[target.'cfg(windows)'.dependencies]
win32job = "2"
# Per-user registration of the native messaging host (HKCU). Safe wrapper over the registry API (MIT).
winreg = "0.56"
# Reads the DACL of config.json to warn when broad groups can read it (SRV-14). Safe wrapper over the
# security APIs (MIT); its dependencies (winapi 0.3, bitflags 1) are already in the tree.
windows-permissions = "0.2"

[dev-dependencies]
# WebSocket client for the end-to-end test against the real sink (already in the tree through the sink).
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true
