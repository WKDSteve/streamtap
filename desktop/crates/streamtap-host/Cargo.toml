[package]
name = "streamtap-host"
version = "0.1.0"
description = "Native messaging host: relays the browser extension's pairing and tab messages to the streamtap app over a loopback bridge"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The bridge's handshake (src/auth.rs): HMAC-SHA256 over fresh nonces, so the bridge key is proved and never
# sent. The versions the workspace already has (p256 and appkit bring them).
hmac = "0.13"
sha2 = "0.11"
getrandom = "0.4"

[lints]
workspace = true
