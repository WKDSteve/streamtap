[package]
name = "streamtap-sink"
version = "0.1.0"
description = "Spike 2: receives MSE segments from the streamtap extension over a loopback WebSocket, writes them per SourceBuffer and remuxes them with ffmpeg"
edition.workspace = true
license.workspace = true
repository.workspace = true
# Not for crates.io: it depends on appkit by git tag.
publish = false

[dependencies]
# Blocking WebSocket server; small enough for a spike, no async runtime.
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Phones over the tailnet (src/tailnet.rs): the one-time pairing code (appkit-core) and the list of paired devices with
# a key of their own each (appkit-hub's DeviceStore, devices.json), from the shared foundation of the app families
# (MOB-11), by tag; Cargo.lock pins the commit. appkit-hub brings an async server the sink does not use.
appkit-core = { git = "https://github.com/WKDSteve/appkit", tag = "v0.49.0" }
appkit-hub = { git = "https://github.com/WKDSteve/appkit", tag = "v0.49.0" }
# The modules of the pairing link's QR code for a program that draws it itself (`devices pair --json`, the desktop
# app): the encoder only, the version appkit-hub brings for its terminal QR code.
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
# A device's key in the tests (tests/tailnet.rs): signs the sink's challenge as WebCrypto would. The version appkit brings.
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }

[lints]
workspace = true
