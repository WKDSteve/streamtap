[package]
name = "streamtap-sink"
version = "0.1.0"
description = "Spike 2: receives MSE segments from the streamtap extension over a loopback WebSocket, writes them per SourceBuffer and remuxes them with ffmpeg"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Blocking WebSocket server; small enough for a spike, no async runtime.
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
