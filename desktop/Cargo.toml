[workspace]
resolver = "2"
members = [
    "crates/streamtap-core",
    "crates/streamtap-testkit",
    "crates/streamtap-sink",
    "crates/streamtap-app",
    "crates/streamtap-host",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/WKDSteve/streamtap"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
