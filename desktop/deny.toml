# cargo-deny: what may enter the dependency tree (NREL-01).
# Run (in desktop/): cargo deny check

[graph]
all-features = false

[advisories]
# Known vulnerabilities and unmaintained crates are errors.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.9
# Only licenses the tree has; a new one is a decision, not a default.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
