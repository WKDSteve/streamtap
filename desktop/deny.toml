# cargo-deny: what may enter the dependency tree (NREL-01).
# Run (in desktop/): cargo deny check

[graph]
all-features = false
# The app is built and shipped for Windows only (self-hosted Windows CI). Tauri's Linux backend (gtk3, glib,
# proc-macro-error) is not in the Windows build; without this its unmaintained crates fail the check.
# Windows-only is a decision, not an omission: RUSTSEC-2024-0370 and RUSTSEC-2024-0429 (GTK3 backend) are therefore
# not ignored here (they are not in this graph) but in .cargo/audit.toml, because cargo-audit reads all of Cargo.lock.
# Add targets here, and decide those two advisories, when a Linux or macOS build is added. No Linux CI until then.
targets = ["x86_64-pc-windows-msvc"]

[advisories]
# Known vulnerabilities and unmaintained crates are errors.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.9
# Only licenses the tree has; a new one is a decision, not a default.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    # Tauri tree: BSD-3-Clause (brotli, build-time asset compression), Zlib (foldhash), MPL-2.0 (cssparser,
    # selectors, option-ext: Tauri build-time HTML handling and dirs). MPL-2.0 is file-level copyleft and
    # applies to changes of those files only; the crates are used unmodified.
    "BSD-3-Clause",
    "Zlib",
    "MPL-2.0",
    # notify (a file watcher appkit-hub brings; the sink does not use it) is CC0-1.0, a public domain dedication.
    "CC0-1.0",
]

[bans]
# windows-permissions (config_access.rs) has been unmaintained since about 2020 and is the only user of winapi. It stays on
# purpose, see "config.json" in README.md; look at it again by 2027-05.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The shared foundation of the app families (appkit), by tag; Cargo.lock pins the commit.
allow-git = ["https://github.com/WKDSteve/appkit"]
