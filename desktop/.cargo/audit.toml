# cargo-audit scans every crate in Cargo.lock, including the ones only the Linux backend of Tauri (wry/gtk3) pulls
# in. The app ships for Windows only (see targets in deny.toml, which checks the Windows graph and needs no ignore).
# Revisit when a Linux build is added: then these need a decision, not an ignore.
[advisories]
ignore = [
    # proc-macro-error is unmaintained: a build-time dependency of gtk3-macros, Linux only.
    "RUSTSEC-2024-0370",
    # glib 0.18 VariantStrIter unsoundness: glib is the GTK backend, Linux only; no glib code runs on Windows.
    "RUSTSEC-2024-0429",
]
