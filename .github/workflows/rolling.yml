# The rolling build: after every green CI run on main, the programs of exactly that commit are built for
# Windows and put on the pre-release `latest`, whose file is replaced each time. It is for looking at
# the newest state with a click, not a release: no version tag, not signed. A release stays a deliberate
# act (release.yml, rule NREL-07).
#
#   streamtap-windows-x86_64.zip   the same content as a release zip (bin\, extension\, install.ps1, ...); its VERSION
#                                  says <version>+<short commit>, which the install shows in Settings > Apps
#   SHA256SUMS                     the checksum of the zip
#
# Runs on the self-hosted Windows runner of the maintainer (`runs-on: [self-hosted, windows]`, by the
# author's choice), so only Windows is built. appkit is public and read without credentials.
#
# Deciding (the newest green commit of main is built) and publishing (SHA256SUMS first, the words of the page
# last) are the actions prepare and publish of appkit's release-kit, pinned by commit (tools/check-workflows.py
# checks the pin). The build is ours: its file goes to publish as an artifact.
#
# Actions are pinned by commit (NREL-03); a job gets only the rights it needs.

name: rolling

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: A green commit of main to build again (full id); empty - the newest green commit
        required: false

# `prepare` picks the newest green commit of main at the start of each run (appkit release-kit), and `latest` only
# moves forward. Concurrency is kept per job, never for the whole workflow: a workflow-level `cancel-in-progress`
# would also kill a `publish` that is halfway through replacing the zip and the checksums, and the pre-release would
# be left without a file. So a newer `build` cancels an older one (group `rolling-build-true`; a run that builds
# nothing has `current` false and lands in a group of its own), and `publish` is never cancelled: a newer publish
# waits for it, and a late older one finds that a newer build is up and does nothing (step "Is it newer").
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# `shell: bash` resolves to the WSL launcher on this machine; Git Bash is named explicitly, in 8.3 form because the
# shell string is split at spaces.
defaults:
  run:
    shell: C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}

jobs:
  prepare:
    # Only a green run that came from a push to main (not a pull request).
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: [self-hosted, windows]
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      current: ${{ steps.prepare.outputs.current }}
      sha: ${{ steps.prepare.outputs.sha }}
      short: ${{ steps.prepare.outputs.short }}
    steps:
      - id: prepare
        uses: WKDSteve/appkit/release-kit/prepare@70df3786e91757f71666cfda1b254847c247c3fe # v0.75.0
        with:
          sha: ${{ github.event.inputs.sha }}
          channels: latest
          token: ${{ github.token }}

  build:
    needs: prepare
    if: ${{ needs.prepare.outputs.current == 'true' }}
    concurrency:
      group: rolling-build-${{ needs.prepare.outputs.current }}
      cancel-in-progress: true
    runs-on: [self-hosted, windows]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      # Installs the toolchain of rust-toolchain.toml when it is missing.
      - name: Toolchain
        working-directory: desktop
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build the programs
        working-directory: desktop
        run: cargo build --release --locked
      - name: Pack
        id: pack
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -eu
          pwsh -NoProfile -File scripts/package-release.ps1 -BuildDir desktop/target/release -OutDir dist -Rolling -Sha "$SHA"
          test -f dist/streamtap-windows-x86_64.zip
          echo "file=dist/streamtap-windows-x86_64.zip" >> "$GITHUB_OUTPUT"
      # The version label of the zip must name the commit of this build: <version>+<short commit>.
      - name: Check the archive
        env:
          FILE: ${{ steps.pack.outputs.file }}
          SHORT: ${{ needs.prepare.outputs.short }}
        run: |
          set -eu
          crate="$(sed -n 's/^version *= *"\(.*\)"/\1/p' desktop/crates/streamtap-app/Cargo.toml | head -n 1)"
          pwsh -NoProfile -File scripts/test-release.ps1 -BuildDir desktop/target/release -Zip "$FILE" -Label "${crate}+${SHORT}"
      # Only the zip goes on: the SHA256SUMS next to it is made again by the publish action.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rolling-windows
          path: ${{ steps.pack.outputs.file }}
          if-no-files-found: error
          retention-days: 1

  # The file and the checksums go up in one job; the words of the page move last, so only then does it name this
  # commit.
  publish:
    needs: [prepare, build]
    # Never cancelled once running (see above); a newer publish waits for this one.
    concurrency:
      group: rolling-publish
      cancel-in-progress: false
    runs-on: [self-hosted, windows]
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write        # the attestation of the files (appkit release-kit, see its README)
      attestations: write
    steps:
      # A publish that waited behind a newer one must not put its older commit over it: latest only moves forward.
      - name: Is it newer than the build that is up
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -eu
          built="$(gh release download latest --repo "$GITHUB_REPOSITORY" --pattern version.json --output - 2>/dev/null | python -c 'import json,sys; print(json.load(sys.stdin).get("commit") or "")' || true)"
          status=identical
          if [ -n "$built" ] && [ "$built" != "$SHA" ]; then
            status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$built...$SHA" --jq .status || echo unknown)"
          fi
          case "$status" in
            ahead | identical) echo "current=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "the build that is up ($built) is not behind $SHA: $SHA is not published"
              echo "current=false" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - if: ${{ steps.tip.outputs.current == 'true' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      # The folder must hold the one downloaded zip and nothing from an earlier job of this runner.
      - name: Empty dist
        if: ${{ steps.tip.outputs.current == 'true' }}
        run: rm -rf dist
      - if: ${{ steps.tip.outputs.current == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rolling-*
          path: dist
          merge-multiple: true
      - if: ${{ steps.tip.outputs.current == 'true' }}
        uses: WKDSteve/appkit/release-kit/publish@70df3786e91757f71666cfda1b254847c247c3fe # v0.75.0
        with:
          token: ${{ github.token }}
          tag: latest
          sha: ${{ needs.prepare.outputs.sha }}
          files: dist
          expect: 1
          app: streamtap
          notes-file: .github/rolling-notes.md
