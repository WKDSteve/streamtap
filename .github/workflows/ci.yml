# CI of streamtap.
#
# One pipeline, two kinds of runner, chosen per job by the event:
#
# - push and workflow_dispatch: the self-hosted runner (the author's Windows machine), by choice; without a running
#   runner a push stays "Queued".
# - pull_request: windows-latest, a throwaway VM with a read-only token and no secrets. A pull request never runs on the
#   self-hosted runner: it would run its own code on the author's machine. tools/check-workflows.py holds this.
#
# A fork can edit this file in its pull request. The repository therefore requires approval before a workflow of an
# outside contributor runs; never approve a pull request that touches `.github/`.
#
# On the self-hosted runner the tools (rustup, cargo-audit, cargo-deny, node, python) are expected on the PATH and print
# their versions. The pull request leg installs the same versions; the steps with an `if` do only that. The Rust
# toolchain itself is the one desktop/rust-toolchain.toml names, so local builds and both legs use the same.

name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # On main a run that started is finished, so that busy days still give green runs (and rolling builds); GitHub keeps
  # one newer run waiting and drops the older waiting ones. Other refs still cancel the run they replace.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

# The shell of each job: `shell: bash` resolves to the WSL launcher on the self-hosted machine, so Git Bash is named there
# explicitly, in 8.3 form because the shell string is split at spaces; on windows-latest `bash` is Git Bash.

jobs:
  rust:
    runs-on: ${{ github.event_name == 'pull_request' && 'windows-latest' || fromJSON('["self-hosted","windows"]') }}
    timeout-minutes: 30
    defaults:
      run:
        shell: ${{ github.event_name == 'pull_request' && 'bash' || 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}' }}
        working-directory: desktop
    steps:
      # Actions are pinned by commit; the comment names the tag.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      # Installs the toolchain of rust-toolchain.toml when it is missing, then names it.
      - if: ${{ github.event_name == 'pull_request' }}
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
      - if: ${{ github.event_name == 'pull_request' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26.2.0
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustc --version && cargo --version && cargo audit --version && cargo deny --version
      # The workspace includes the Tauri app: it builds on a plain Windows runner (WebView2 is only needed to run it).
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The drivers against the real sink of that build, with a small fragmented fixture.
      - run: node scripts/test-sink-live.mjs
      # The supply chain: known advisories, licenses, sources.
      - run: cargo audit --deny warnings
      - run: cargo deny check

  extension:
    runs-on: ${{ github.event_name == 'pull_request' && 'windows-latest' || fromJSON('["self-hosted","windows"]') }}
    timeout-minutes: 10
    defaults:
      run:
        shell: ${{ github.event_name == 'pull_request' && 'bash' || 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      - if: ${{ github.event_name == 'pull_request' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26.2.0
      - run: node --version
      # Syntax of every script of the extension and of the test drivers.
      - name: node --check
        run: git ls-files -z 'extension/*.js' 'extension/*.mjs' 'desktop/scripts/*.mjs' 'desktop/crates/streamtap-app/ui/*.js' | xargs -0 -n1 node --check
      # The MSE hook in Node with stand-ins; needs neither a browser nor a sink.
      - run: node extension/scripts/test-hook.mjs
      # The content script's replay for a new port, also without a browser.
      - run: node extension/scripts/test-content.mjs
      # The pairing module (fake native port and storage) and the per-tab tapping gate of the content script.
      - run: node extension/scripts/test-pairing.mjs
      # The popup in a fake DOM: forged values come out as text, never as markup.
      - run: node extension/scripts/test-popup.mjs
      # The sink link's lost-init and drain paths with a fake WebSocket (no arguments: mock mode, no sink).
      - run: node desktop/scripts/test-sink-link.mjs
      # The app UI: German and English tables match, every used key exists, both themes keep their contrast.
      - run: node desktop/scripts/test-app-ui.mjs

  # The app's page in a real Chrome: axe in light and dark, also hovered and focused. Playwright and axe come at fixed
  # versions from tools/page-check; streamtap has no other Node dependency.
  page:
    runs-on: ${{ github.event_name == 'pull_request' && 'windows-latest' || fromJSON('["self-hosted","windows"]') }}
    timeout-minutes: 10
    defaults:
      run:
        shell: ${{ github.event_name == 'pull_request' && 'bash' || 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      - if: ${{ github.event_name == 'pull_request' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26.2.0
      - if: ${{ github.event_name == 'pull_request' }}
        run: npm install --global pnpm@10.29.2
      - run: node --version && pnpm --version
      - run: pnpm --dir tools/page-check install --frozen-lockfile
      - run: node tools/page-check.mjs tools/page-check/node_modules
      # The test sheets (TESTS/sheets, .testing.lua) at a fixed version of testing.nvim; --strict: a sheet that could
      # not run is red here. Only on the maintainer's runner: nvim comes from its PATH, the hosted VM has none.
      - if: ${{ github.event_name != 'pull_request' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          repository: WKDSteve/testing.nvim
          ref: 10dcc98a63d41a2870572cd81e14c4ab2ca548ee
          path: .deps/testing.nvim
          persist-credentials: false
      - if: ${{ github.event_name != 'pull_request' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          repository: WKDSteve/lib.nvim
          ref: 37bf8bd87858ca84b26cf271605fab0679ddaddb
          path: .deps/lib.nvim
          persist-credentials: false
      - if: ${{ github.event_name != 'pull_request' }}
        # by name: mse-capture loads the extension, which needs Playwright's full Chromium (job extension-sheet)
        run: nvim -n -i NONE --headless -u NONE -l .deps/testing.nvim/scripts/testing.lua sheets run --sheet button-looks --root . --strict
        env:
          LIB_NVIM_DIR: ${{ github.workspace }}/.deps/lib.nvim

  # The extension itself in a browser: TESTS/sheets/mse-capture.sheet.lua loads extension/ unpacked into Playwright's
  # full Chromium, against a real sink built here and the repository's own MSE fixture (tools/sheet-mse.mjs): never a
  # page of somebody else, never DRM. That Chromium does not start on the maintainer's runner and branded Chrome refuses
  # an unpacked extension, so this one job runs on a hosted Linux VM for every event (tools/check-workflows.py,
  # HOSTED_CI_JOBS): a throwaway machine either way, nothing of the author's.
  extension-sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26.2.0
      - run: npm install --global pnpm@10.29.2
      - run: pnpm --dir tools/page-check install --frozen-lockfile
      # playwright-core of tools/page-check installs the Chromium of its own version, with the libraries it needs
      - run: tools/page-check/node_modules/.bin/playwright-core install --with-deps chromium
      # The toolchain of desktop/rust-toolchain.toml; the sink itself is built by the app entry of .testing.lua.
      - run: rustup show active-toolchain || rustup toolchain install
        working-directory: desktop
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: v0.12.2
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          repository: WKDSteve/testing.nvim
          ref: 49de00d301e3165c019489bd73dfee8eedc5e9e7
          path: .deps/testing.nvim
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          repository: WKDSteve/lib.nvim
          ref: 37bf8bd87858ca84b26cf271605fab0679ddaddb
          path: .deps/lib.nvim
          persist-credentials: false
      - run: nvim -n -i NONE --headless -u NONE -l .deps/testing.nvim/scripts/testing.lua sheets run --sheet mse-capture --root . --strict
        env:
          LIB_NVIM_DIR: ${{ github.workspace }}/.deps/lib.nvim

  # A control or invisible character in a tracked text file (a backspace in a path, a bidirectional override in
  # source) is refused; the tool tests itself.
  hygiene:
    runs-on: ${{ github.event_name == 'pull_request' && 'windows-latest' || fromJSON('["self-hosted","windows"]') }}
    timeout-minutes: 10
    defaults:
      run:
        shell: ${{ github.event_name == 'pull_request' && 'bash' || 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      - if: ${{ github.event_name == 'pull_request' }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.14.6
      # taiki-e/install-action does not know actionlint on Windows. The Go proxy checks the module against its checksum.
      - if: ${{ github.event_name == 'pull_request' }}
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go env GOPATH | sed 's|$|/bin|' >> "$GITHUB_PATH"
      - run: python -m unittest discover tools
      - run: python tools/check-control-chars.py
      # Every colour of the app's UI comes from palette.css (generated from the icon by the app icons tool of the
      # tasks vault); a hex colour or a colour function in any other stylesheet is refused. Copy of appkit's tool.
      - run: python tools/check-color-literals.py --root desktop/crates/streamtap-app/ui --tokens desktop/crates/streamtap-app/ui/palette.css
      # The rules of the workflows (release.yml, rolling.yml, this one): actions pinned by commit, appkit's release-kit
      # on one commit, self-hosted runner only, no pull request trigger, a release stays a draft; --online asks each
      # action's repository whether its tag still names the pinned commit.
      # Its own step with its own limit: a stalled connection to github.com must not eat the time of the steps below.
      - name: Workflow rules
        timeout-minutes: 3
        run: python tools/check-workflows.py --online
      # Syntax and expressions of the workflows, which the rules above do not read. The runner has it
      # (TOOLS/self-hosted-runner.md, `runners.ps1 check`).
      - run: actionlint
      # scripts/install.ps1, build-install.ps1 and uninstall.ps1 against stand-in programs: install folder, Start menu folder and
      # data folders in a temp folder of the test, the registry root a throw-away HKCU key it removes; the runner's
      # own Start menu, uninstall entries and browser keys are left alone, nothing is built.
      - name: Install and uninstall scripts
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-install.ps1
      # scripts/package-release.ps1 against stand-in programs (nothing is built): the zip's contents, checksums,
      # reproducibility, the refusals, then the unpacked zip's install.ps1 into temp places and the uninstall. The
      # release and rolling workflows run it again on the zip they are about to publish.
      - name: Release packaging
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-release.ps1
      - name: PSScriptAnalyzer on the scripts
        shell: pwsh
        run: |
          # The gallery is down now and then: a copy of the pinned version on the runner is enough, and a download is
          # tried a few times.
          $pinned = Get-Module PSScriptAnalyzer -ListAvailable | Where-Object Version -EQ '1.24.0'
          for ($try = 1; -not $pinned -and $try -le 3; $try++) {
              try {
                  Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force -ErrorAction Stop
                  $pinned = $true
              }
              catch {
                  if ($try -eq 3) { throw }
                  Start-Sleep -Seconds (20 * $try)
              }
          }
          # Import by version too: autoloading would take the newest copy on the runner, not the pinned one.
          Import-Module PSScriptAnalyzer -RequiredVersion 1.24.0
          (Get-Module PSScriptAnalyzer).Version
          $found = @(Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error, Warning)
          $found | Format-Table -AutoSize | Out-String | Write-Output
          if ($found) { exit 1 }
