<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>streamtap</title>
    <style>
      body { font: 12px/1.4 system-ui, sans-serif; margin: 0; padding: 10px; width: 520px; color: #222; }
      h1 { font-size: 13px; margin: 0 0 6px; }
      .drm { background: #fde7e9; color: #8a0012; padding: 6px 8px; border-radius: 4px; margin-bottom: 8px; }
      .ms { border: 1px solid #ddd; border-radius: 4px; padding: 6px 8px; margin-bottom: 8px; }
      .ms h2 { font-size: 12px; margin: 0 0 4px; font-weight: 600; }
      table { border-collapse: collapse; width: 100%; }
      th, td { text-align: left; padding: 2px 6px 2px 0; vertical-align: top; white-space: nowrap; }
      th { color: #666; font-weight: 500; }
      td.mime { white-space: normal; word-break: break-all; max-width: 200px; }
      .muted { color: #777; }
      button { margin-top: 6px; }
      .sink { margin-top: 10px; border: 1px solid #ddd; border-radius: 4px; }
      .sink label { margin-right: 8px; }
      .sink input { width: 110px; }
    </style>
  </head>
  <body>
    <h1>streamtap · Spike 1</h1>
    <div id="out" class="muted">loading…</div>
    <button id="clear">clear tab state</button>
    <div class="muted">
      <span id="pair">app pairing: …</span>
      <button id="pair-now">pair now</button>
    </div>
    <fieldset class="sink">
      <legend>Sink (manual fallback; a paired app fills this in)</legend>
      <label>port <input id="port" type="number" min="1" max="65535" size="6" /></label>
      <label>token <input id="token" type="password" size="16" /></label>
      <button id="save">save</button>
      <span id="link" class="muted"></span>
    </fieldset>
    <script src="popup.js"></script>
  </body>
</html>
